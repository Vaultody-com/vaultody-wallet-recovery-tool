name: Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  playwright-electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      # npm unpacks chrome-sandbox as runner:runner, so Electron aborts with
      # "The SUID sandbox helper binary ... is not configured correctly" rather
      # than run unsandboxed, and Ubuntu 24.04 blocks the userns fallback
      # (kernel.apparmor_restrict_unprivileged_userns = 1). Fix the helper
      # instead of passing --no-sandbox, so the suite exercises the app in the
      # sandboxed configuration it actually ships in.
      - name: Configure the Electron sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # Electron needs a display; the suite drives the real app window.
      - name: Run Playwright tests
        run: xvfb-run --auto-servernum npm test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
