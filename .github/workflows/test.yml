name: Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  playwright-electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      # TEMPORARY: capture the real stderr behind Playwright's
      # "Process failed to launch!" so the fix is not a guess.
      - name: Diagnose Electron launch
        continue-on-error: true
        run: |
          echo "--- runner ---"
          cat /etc/os-release | head -2
          echo "--- chrome-sandbox perms ---"
          ls -la node_modules/electron/dist/chrome-sandbox || true
          echo "--- userns clone (Ubuntu 24.04 AppArmor) ---"
          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo "(absent)"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "(absent)"
          echo "--- electron --version ---"
          xvfb-run --auto-servernum ./node_modules/.bin/electron --version; echo "exit=$?"
          echo "--- electron . (bare) ---"
          set +e
          ELECTRON_ENABLE_LOGGING=1 timeout 25 xvfb-run --auto-servernum ./node_modules/.bin/electron . 2>&1 | tail -40
          echo "exit=$?"
          echo "--- electron . --no-sandbox ---"
          ELECTRON_ENABLE_LOGGING=1 timeout 25 xvfb-run --auto-servernum ./node_modules/.bin/electron . --no-sandbox 2>&1 | tail -40
          echo "exit=$?"

      # Electron needs a display; the suite drives the real app window.
      - name: Run Playwright tests
        run: xvfb-run --auto-servernum npm test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
