<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <link href="../resources/css/styles.css" rel="stylesheet">
    <title>VAULTODY Vault Recovery Tool</title>
</head>

<body data-nav="rsa-key-pairs">
    <div class="window">
        <div class="topbar" id="topbar"></div>
        <div class="app">
            <nav class="rail" id="rail"></nav>
            <main class="main">
                <section class="screen">
                    <div class="eyebrow">Back up &middot; step 2</div>
                    <h1 class="page-title">Generate an RSA key pair</h1>
                    <p class="lede">VAULTODY needs only the <b>public</b> key. You keep the encrypted private key and
                        the password &mdash; together they are what restores your vault.</p>

                    <div class="card">
                        <div class="field-label">
                            Private RSA key encryption password
                            <span class="req">&middot; min 8 characters, 1 uppercase, 1 digit, 1 symbol</span>
                        </div>
                        <div class="secret-row">
                            <!--suppress HtmlFormInputWithoutLabel -->
                            <input type="password" id="password" class="input" minlength="8"
                                aria-label="Private RSA key encryption password" />
                            <button type="button" class="icon-btn" id="reveal-password" title="Reveal"
                                aria-label="Reveal or hide the password"></button>
                        </div>
                        <div class="key-actions">
                            <button id="generate-button" type="button" class="btn btn-primary"></button>
                        </div>
                    </div>

                    <div class="result-container" id="generate-rsa-result-container"></div>

                    <div class="note danger" id="rsa-note"></div>
                </section>
            </main>
        </div>
    </div>
    <script src="common.js"></script>
    <script src="rsa-key-generator.js"></script>
</body>

</html>
