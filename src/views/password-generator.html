<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <link href="../resources/css/styles.css" rel="stylesheet">
    <title>VAULTODY Wallet Recovery Tool</title>
</head>

<body data-nav="generate-password">
    <div class="window">
        <div class="topbar" id="topbar"></div>
        <div class="app">
            <nav class="rail" id="rail"></nav>
            <main class="main">
                <section class="screen">
                    <div class="eyebrow">Back up &middot; step 1</div>
                    <h1 class="page-title">Generate a random password</h1>
                    <p class="lede">Use your own password, or generate a complex one here. This password encrypts the
                        private key of your RSA key pair, and it will be needed to recover your wallet.</p>

                    <div class="card">
                        <div class="field-label">Generated password</div>
                        <div class="secret-row">
                            <!--suppress HtmlFormInputWithoutLabel -->
                            <input type="password" id="generate-new-password-input" class="input" readonly
                                aria-label="Generated password" />
                            <button type="button" class="icon-btn" id="reveal-password" title="Reveal"
                                aria-label="Reveal or hide the generated password"></button>
                            <button type="button" class="icon-btn" id="copy-icon" title="Copy"
                                aria-label="Copy the generated password"></button>
                        </div>
                        <div class="key-actions">
                            <button id="generate-new-password-button" type="button" class="btn btn-primary"></button>
                        </div>
                    </div>

                    <div class="note" id="password-note"></div>
                </section>
            </main>
        </div>
    </div>
    <script src="common.js"></script>
    <script src="password-generator.js"></script>
</body>

</html>
