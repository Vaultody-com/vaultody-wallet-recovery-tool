<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <link href="../resources/css/styles.css" rel="stylesheet">
    <title>VAULTODY WaaS Emergency Recovery Tool</title>
</head>

<body data-nav="recovery">
    <div class="window">
        <div class="topbar" id="topbar"></div>
        <div class="app">
            <nav class="rail" id="rail"></nav>
            <main class="main">
                <section class="screen">
                    <div class="eyebrow">Emergency recovery</div>
                    <h1 class="page-title">Recover wallet with an RSA key you provided</h1>
                    <p class="lede">Rebuild your wallet's master xPriv offline. You need the backup data file you
                        downloaded from the VAULTODY Dashboard, your RSA private key, and its password.</p>

                    <div class="card form-grid">
                        <div>
                            <div class="field-label">Recovery data file <span class="req">&middot; .json</span></div>
                            <div id="recoveryDataFileField"></div>
                        </div>
                        <div>
                            <div class="field-label"><label for="privateKeySelect">Private key type</label></div>
                            <select class="input" id="privateKeySelect">
                                <option value="sjclEncryptedPrivateKey">SJCL Encrypted Private Key</option>
                                <option value="rawPemPrivateKey">Raw Pem Private Key</option>
                            </select>
                        </div>
                        <div id="privateKeyContainer"></div>
                        <div>
                            <button id="recoverButton" type="button" class="btn btn-primary btn-block"></button>
                        </div>
                    </div>

                    <div class="result-container" id="recoveryResultContainer"></div>
                </section>
            </main>
        </div>
    </div>
    <script src="common.js"></script>
    <script src="recover-common.js"></script>
    <script src="recover-self-provided.js"></script>
</body>

</html>
